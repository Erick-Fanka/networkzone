! Configurar VLANS
  enable
  configure terminal
  hostname SW3
  vlan 10
  exit
  vlan 20
  exit
  vlan 30
  exit
! Configurar porta que vem do Switch 2 em mode trunk
  interface fastEthernet 0/24
  switchport mode trunk
  exit
! Configurar porta que vem do Switch 1 em mode trunk
  interface fastEthernet 0/23
  switchport mode trunk
  exit
! configurar porta que vem do Roteador 1 em mode trunk
  interface gigabitEthernet 0/1
  switchport mode trunk
  exit
  end
  copy running-config startup-config
